<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  {{- partial "header.html" . }}
  <main>
    {{- block "main" . }}{{- end }}
  </main>
  {{- partial "footer.html" . }}
  {{- $motion := resources.Get "js/motion.js" | minify | resources.Copy "js/motion.js" }}
  <script src="{{ $motion.RelPermalink }}" defer></script>
</body>
</html>
