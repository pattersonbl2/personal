    tech: "K3s · ArgoCD · Go · n8n · Ollama · Cloudflare Tunnel"
    summary: "A free, self-hosted Kubernetes training platform with a real cluster and a browser terminal. Five tasks take you from \"what is a Pod?\" to deploying an app on the internet. Built, deployed, and operated end to end on my own hardware."
    outcome: "Live and used by strangers on the internet. Survived its first real security review and a 24-hour silent outage that I found, fixed, and wrote up."
