projects:
  - title: "sre-reflex — alert triage without a giant context window"
    tech: "Prometheus · Go · decision model · shadow mode"
    summary: "A bot that scores every Prometheus alert before I decide whether to care. It uses a small decision model instead of a large LLM context window, and runs in shadow mode so it cannot make an incident worse while I measure it."
    outcome: "Running in shadow mode against real homelab alerts, with my own human labels as ground truth."
    link: "/posts/alert-triage-decision-models/"
    linkLabel: "Read the write-up"
    writeups: []
    featured: true

