      - { label: "How I monitor everything", url: "/posts/homelab-monitoring-deep-dive/" }
      - { label: "Building it with AI help", url: "/posts/ai-powered-platform-building/" }
    featured: true

  - title: "ark31.info — this site"
    tech: "Hugo · Go · Cloudflare Pages · GCP Cloud Run · Terraform"
    summary: "A custom Hugo theme fronting a Go API that handles contact submissions, rate limiting, and signed resume PDF delivery, with Cloudflare Turnstile for anti-spam. Shipped through PR checks with auto-merge on green."
